# nginx config for the production VisionForge SPA.
#
# - Serves the static Vite bundle with SPA history fallback.
# - Reverse-proxies the backend API so the SPA can talk to the same origin
#   (no CORS, no baked-in API URL needed). The backend host defaults to the
#   docker-compose service name `backend`; override by editing the upstream
#   or templating this file in your own deployment.

upstream visionforge_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Lightweight liveness endpoint for container healthchecks.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Proxy API + auth + ops traffic to the backend.
    location ~ ^/(api|auth|health|metrics|docs|redoc|openapi.json) {
        proxy_pass http://visionforge_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events (job status stream) must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Cache hashed static assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
