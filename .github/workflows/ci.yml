name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps the install lean; requirements.txt's
          # torch>=2.3 is then already satisfied and won't pull the CUDA wheel.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Ruff
        run: ruff check backend/src backend/tests

      - name: Black (check)
        run: black --check backend/src backend/tests

      - name: Unit tests
        env:
          SKIP_DB_MIGRATIONS: "1"
        working-directory: backend
        run: pytest -q tests/unit/

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Note: package-lock.json is not committed in this repo, so we use
      # `npm install` (not `npm ci`) and skip lockfile-based caching.
      - name: Install dependencies
        run: npm install

      - name: ESLint
        run: npm run lint

      - name: Build
        run: npm run build

  agent:
    name: Agent (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt pytest

      - name: Agent tests
        working-directory: agent
        run: pytest -q tests/
