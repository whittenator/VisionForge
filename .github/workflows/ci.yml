name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-test.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Unit tests don't touch the ML stack (it's imported lazily inside
          # services), so we install a lightweight set — fast and deterministic.
          # See backend/requirements-test.txt.
          pip install -r backend/requirements-test.txt -r backend/requirements-dev.txt

      - name: Ruff
        run: ruff check backend/src backend/tests

      - name: Black (check)
        run: black --check backend/src backend/tests

      - name: Unit tests
        env:
          SKIP_DB_MIGRATIONS: "1"
        working-directory: backend
        # addopts in pyproject.toml already enables --cov=app; the floor here
        # locks in current coverage and is meant to be ratcheted upward.
        run: pytest -q tests/unit/ --cov-fail-under=62

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Note: package-lock.json is not committed in this repo, so we use
      # `npm install` (not `npm ci`) and skip lockfile-based caching.
      - name: Install dependencies
        run: npm install

      - name: ESLint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm run test:unit

      - name: Build
        run: npm run build

  agent:
    name: Agent (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt pytest

      - name: Agent tests
        working-directory: agent
        run: pytest -q tests/
